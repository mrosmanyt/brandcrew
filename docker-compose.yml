services:
  postgres:
    image: postgres:16-alpine
    container_name: brandcrew-postgres
    environment:
      POSTGRES_USER: brandcrew
      POSTGRES_PASSWORD: brandcrew
      POSTGRES_DB: brandcrew
    ports:
      - "5432:5432"
    volumes:
      - brandcrew_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandcrew -d brandcrew"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  brandcrew_pg:
