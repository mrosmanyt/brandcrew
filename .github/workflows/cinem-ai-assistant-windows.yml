# Optional advanced Tauri-only NSIS (Cinem-AI-Assistant-Setup.exe).
# Primary download is the unified Electron installer from desktop-windows.yml
# (CINEM-Pro-Setup.exe). Not part of everyday Vercel / Next CI.
name: Cinem AI Assistant Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "cinem-ai-assistant-v*"

permissions:
  contents: write

jobs:
  windows-nsis:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/cinem-ai-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/cinem-ai-assistant/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/cinem-ai-assistant/src-tauri

      - name: Install frontend dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Generate icons
        run: |
          npm run icon
          npx tauri icon app-icon.png

      - name: Build frontend (tsc + vite)
        run: npm run build
        env:
          VITE_CINEM_CLOUD_URL: https://app.cinem.tech
          VITE_CINEM_UPGRADE_URL: https://app.cinem.tech/billing?plan=pro&product=cinem-ai-assistant

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis
        env:
          VITE_CINEM_CLOUD_URL: https://app.cinem.tech
          VITE_CINEM_UPGRADE_URL: https://app.cinem.tech/billing?plan=pro&product=cinem-ai-assistant

      - name: Rename to Cinem-AI-Assistant-Setup.exe
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item $nsis.FullName "release/Cinem-AI-Assistant-Setup.exe"
          Get-Item "release/Cinem-AI-Assistant-Setup.exe" | Format-List FullName, Length, LastWriteTime

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinem-AI-Assistant-Setup
          path: apps/cinem-ai-assistant/release/Cinem-AI-Assistant-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/cinem-ai-assistant-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/cinem-ai-assistant/release/Cinem-AI-Assistant-Setup.exe
