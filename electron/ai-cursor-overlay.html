<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Cursor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
    }
    .ring {
      width: 28px;
      height: 28px;
      border: 2px solid #00d4ff;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.85), inset 0 0 6px rgba(0, 212, 255, 0.4);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      background: #00d4ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00d4ff;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="ring"><div class="dot"></div></div>
</body>
</html>
