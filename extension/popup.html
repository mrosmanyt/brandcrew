<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CINEM Pro</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/cinem-logo.png" alt="" width="28" height="28" />
      <div>
        <strong>CINEM Pro</strong>
        <p id="status-line">Live browser employee</p>
      </div>
    </header>
    <section id="main">
      <p id="detail" class="hint">Toolbar click opens the side panel.</p>
      <button type="button" id="open-panel">Open panel</button>
      <button type="button" id="open-desk" class="ghost">Open desk</button>
      <button type="button" id="signin">Sign in with CINEM</button>
      <p class="hint">Or paste login link / pairing code in the side panel.</p>
      <label>
        Or paste login link
        <input id="login-link" type="text" placeholder="https://app.cinem.tech/connect/extension?nonce=…" autocomplete="off" />
      </label>
      <button type="button" id="paste-link" class="ghost">Use login link</button>
      <button type="button" id="unpair" class="ghost" hidden>Unpair</button>
    </section>
    <p id="error" class="error" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
